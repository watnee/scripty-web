server:
  forward-headers-strategy: framework
  servlet:
    session:
      # Default 30m expired active sessions mid-edit; remember-me re-authenticates
      # silently after expiry, but a longer window avoids the session/CSRF churn.
      timeout: 12h
      cookie:
        secure: true
        http-only: true
        same-site: lax

spring:
  datasource:
    # Prefer TLS when the DB supports it. On Railway private networking without TLS,
    # set MYSQL_SSL_MODE=DISABLED (and keep MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL=true if needed).
    url: jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?sslMode=${MYSQL_SSL_MODE:PREFERRED}&allowPublicKeyRetrieval=${MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL:true}&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQLUSER}
    password: ${MYSQLPASSWORD}
    hikari:
      # Named so the Hikari metrics Actuator exports (hikaricp.connections.*)
      # carry a readable pool tag on the Grafana dashboards instead of HikariPool-1.
      pool-name: scripty-pool
      # Fixed-size pool: minimum-idle tracks maximum-pool-size so the pool does not
      # shrink and then pay reconnect cost on the next burst. Tunable by variable
      # because raising it is a Railway restart, not a redeploy.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_SIZE:10}
      # Fail a request that cannot get a connection in 10s rather than parking the
      # servlet thread for Hikari's 30s default — with the pool exhausted, a 30s
      # wait ties up threads faster than it clears them.
      connection-timeout: 10000
      # The pair that matters on Railway. Private networking drops idle TCP with no
      # notice to either end, so a connection can sit in the pool healthy-looking
      # and be dead when handed out ("Communications link failure" on a normal
      # request). keepalive-time probes idle connections every 4 minutes, and
      # max-lifetime retires each one well before MySQL's own wait_timeout or any
      # intermediate idle cutoff can reap it. keepalive-time must stay below
      # max-lifetime, which must stay below the server's wait_timeout.
      keepalive-time: 240000
      max-lifetime: 900000
      # A connection still checked out after 30s is a leak, not slow work: every
      # request path here is short. Logs the borrowing stack trace rather than
      # leaving the pool to drain silently.
      leak-detection-threshold: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    baseline-on-migrate: true
  servlet:
    # Sized for a song's recordings, which are the largest thing anyone uploads
    # here — a headshot is capped at 5 MB by its own service and is unaffected.
    multipart:
      max-file-size: 25MB
      max-request-size: 27MB
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

logging:
  structured:
    format:
      # ECS JSON on stdout: Railway log search gets fields (log.level, request_id
      # from MDC, …) instead of free text. Set LOG_FORMAT= (empty) to fall back
      # to plain text.
      console: ${LOG_FORMAT:ecs}

app:
  headshot-max-bytes: 5242880
  # See application-dev.yml: 25 MB, a whisker under the multipart cap so an
  # oversized recording is refused with a sentence rather than by the container.
  song-audio-max-bytes: ${APP_SONG_AUDIO_MAX_BYTES:26214400}
  base-url: ${APP_BASE_URL:}
  mail-from: ${MAIL_FROM:Scripty <noreply@localhost>}
  # Where "if this wasn't you" sends someone. Unlike mail-from this has to be an
  # address a person reads, so it is separate rather than derived.
  support-email: ${SUPPORT_EMAIL:support@scripty.app}
  mail-enabled: ${MAIL_ENABLED:false}
  # Preferred email transport on Railway (outbound SMTP is restricted there).
  # When both are set, emails go through the Cloudflare email Worker
  # (POST /internal/email, Cloudflare Email Sending) and the SMTP settings
  # above are ignored; MAIL_ENABLED is not required.
  email-worker-url: ${EMAIL_WORKER_URL:}
  email-worker-secret: ${EMAIL_WORKER_SECRET:}
  asset-version: ${APP_ASSET_VERSION:256}
