<!DOCTYPE html>
<!--/*
  The shell every Scripty email is poured into.

  Email clients are not browsers: there is no stylesheet to link, Gmail strips
  <style> blocks it dislikes, and Outlook renders with Word. So everything here
  is an inline style on an element, and nothing depends on a class. Keep it that
  way — a rule that works in a browser preview is not evidence.

  Callers pass a heading and a fragment:
    ~{email/layout :: document('Reset your password', ~{:: #content})}
*/-->
<html xmlns:th="http://www.thymeleaf.org" th:fragment="document(heading, content)">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${heading}">Scripty</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f4f5f7;">
    <div style="max-width: 600px; margin: 0 auto; padding: 24px 20px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; line-height: 1.6; color: #1f2937;">
        <p style="margin: 0 0 4px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #6b7280;">Scripty</p>
        <h1 style="margin: 0 0 20px; font-size: 22px; font-weight: 600; color: #111827;" th:text="${heading}">Heading</h1>

        <th:block th:replace="${content}">
            <p>Body goes here.</p>
        </th:block>

        <hr style="border: none; border-top: 1px solid #e5e7eb; margin: 32px 0 16px;" />
        <p style="margin: 0; font-size: 12px; color: #9ca3af;">
            Sent by Scripty. This is an automated message — replies to it are not read.
        </p>
    </div>
</body>
</html>
