<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="menu">
    <!--/* The song editor's Tools menu, mirroring the screenplay's Tools dropdown
           in project/show.html: text-size controls, a word-count toggle, and the
           spellcheck toggle.

           The text size buttons reuse the ids #text-size-decrease /
           #text-size-increase so the globally-loaded js/text-size.js (from nav)
           drives them, and .song-block-textarea scales via the shared
           --scripty-text-scale custom property.

           Word count is computed live over the lyric textareas by
           song-tools-menu.js and shown in the toolbar meta bar; the toggle reuses
           word-count-toggle.js (the shared #nav-word-count-toggle handler and the
           html.scripty-word-count-hidden class). Spellcheck reuses the global
           toggle (browser-spellcheck.js), which already covers the song block
           textareas. Loaded from nav.html so it survives HTMX-boosted navigation. */-->
    <div class="nav-dropdown tools-dropdown song-tools-dropdown" id="song-tools-dropdown">
        <button id="song-nav-tools"
                type="button"
                class="nav-dropdown-toggle tools-toolbar-btn"
                aria-haspopup="true"
                aria-expanded="false"
                aria-label="Tools"
                title="Tools">
            Tools
        </button>
        <div class="nav-dropdown-menu tools-menu" role="menu" aria-label="Tools">
            <div class="tools-menu-text-size" role="group" aria-label="Text size">
                <span class="tools-menu-text-size-label">Text size</span>
                <span class="text-size-buttons">
                    <button id="text-size-decrease" type="button" class="text-size-btn" aria-label="Decrease text size">A−</button>
                    <button id="text-size-increase" type="button" class="text-size-btn" aria-label="Increase text size">A+</button>
                </span>
            </div>
            <button id="nav-word-count-toggle"
                    type="button"
                    class="nav-dropdown-item word-count-filter-toggle is-active"
                    role="menuitemcheckbox"
                    aria-pressed="true"
                    aria-checked="false"
                    aria-label="Show word count"
                    title="Show word count">
                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M4 19V5"></path>
                    <path d="M4 19h16"></path>
                    <path d="M8 15V9"></path>
                    <path d="M12 15v-3"></path>
                    <path d="M16 15V7"></path>
                </svg>
                <span>Word count</span>
            </button>
            <button th:replace="~{fragments/spellcheckToggle :: menuItem}"></button>
            <!--/* The editing lock (document-lock.js), which the screenplay has
                   had since it shipped: a finished lyric being read from at a
                   rehearsal should not gain a stray character. Device-local, and
                   per edition when the song has more than one. */-->
            <button type="button"
                    class="nav-dropdown-item document-lock-toggle"
                    role="menuitemcheckbox"
                    th:if="${canEditScript}"
                    data-document-lock
                    aria-pressed="false"
                    aria-checked="false"
                    aria-label="Lock editing"
                    title="Close this to typing on this device">
                <span th:replace="~{fragments/lockIcon :: toolbarIcon}"></span>
                <span><span data-document-lock-label>Lock</span> editing</span>
            </button>
            <!--/* Read aloud reads the lyric lines in this editor, in the same
                   voice and at the same speed the screenplay is read in — those
                   are the writer's preferences, not the document's. The entry
                   hides itself where the browser has no voices. */-->
            <button type="button"
                    class="nav-dropdown-item"
                    role="menuitem"
                    data-read-aloud-entry
                    aria-label="Read aloud"
                    title="Read this song aloud">
                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
                    <path d="M18.5 5.5a9 9 0 0 1 0 13"></path>
                </svg>
                <span>Read aloud</span>
            </button>
        </div>
    </div>
</th:block>
