<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/pwaMeta :: pwaMeta}"></th:block>
    <meta charset="UTF-8">
    <title th:text="${isNew} ? (${isSong} ? 'Scripty - New Song' : 'Scripty - New Note') : ('Scripty - ' + ${commandModel.title})">Scripty - Document</title>
    <link rel="stylesheet" href="/css/missing.min.css">
    <link th:href="@{/css/scripty.css(v=${assetVersion})}" rel="stylesheet">
    <link rel="shortcut icon" th:href="@{/favicon.ico}" type="image/x-icon">
</head>
<body hx-boost="true">
    <div th:replace="~{fragments/nav :: nav('')}"></div>
    <main class="text-documents-page text-document-edit-page"
          th:classappend="${isSong} ? ' text-document-edit-page--song' : ' text-document-edit-page--draft'">
        <div class="top-bar">
            <nav aria-label="Breadcrumb">
                <ol>
                    <li><a th:href="@{/project/list}">Projects</a></li>
                    <li><a th:href="@{/project/show(id=${projectId})}" th:text="${projectTitle}">Project</a></li>
                    <li>
                        <a th:href="@{${listPath}(projectId=${projectId})}"
                           th:text="${isSong} ? 'Songs' : 'Notes'">Documents</a>
                    </li>
                    <li aria-current="page" class="text-document-breadcrumb-title">
                        <label class="text-document-breadcrumb-title-label">
                            <span class="visually-hidden"
                                  th:text="${isSong} ? 'Song Title' : 'Note Title'">Title</span>
                            <input type="text"
                                   id="title"
                                   name="title"
                                   form="text-document-form"
                                   class="text-document-breadcrumb-title-input auto-grow"
                                   th:value="${commandModel.title}"
                                   th:placeholder="${isNew} ? (${isSong} ? 'New Song' : 'New Note') : (${isSong} ? 'Song title' : 'Note title')"
                                   th:attr="aria-label=${isSong} ? 'Song Title' : 'Note Title'"
                                   autocomplete="off"
                                   spellcheck="true"
                                   maxlength="200"
                                   required />
                        </label>
                    </li>
                </ol>
            </nav>
            <div class="text-document-top-bar-actions">
                <!--/* Put it up to be read: the reading page this editor's words
                       belong to, in the same place the screenplay offers Read
                       Script. Only for a document that exists — a new one has
                       nothing to read yet. */-->
                <a th:if="${!isNew}"
                   class="project-list-action-btn project-list-action-btn--secondary"
                   th:href="@{/project/documents/read(id=${commandModel.id})}"
                   th:title="${isSong} ? 'Read this song without the editing' : 'Read this note without the editing'"
                   th:text="${isSong} ? 'Read song' : 'Read note'">Read</a>
                <th:block th:replace="~{fragments/textDocumentAbout :: about(${isSong})}"></th:block>
            </div>
        </div>

        <!--/* Says where this document lives, and offers the way back.

               An archived song or note opens here in place, so a writer can be
               typing into something the list no longer shows with nothing on
               screen to say so — and the way back was a trip out to the archive
               page to find the row. The iPad client wears the same strip in the
               same place, in the same words.

               The button goes only to someone who may edit: the sentence is for
               everyone, the action is not. Unarchiving from here redirects to
               the list, as it does from the archive page — what came back is
               what you are now looking for. */-->
        <div class="text-document-archived-banner" th:if="${isArchived}" role="status">
            <span class="text-document-archived-mark" aria-hidden="true">📦</span>
            <span class="text-document-archived-text">
                <strong>Archived</strong>
                <span class="muted"
                      th:text="${isSong} ? '— not in your songs' : '— not in your notes'">— put aside</span>
            </span>
            <form th:action="@{/project/documents/unarchive}"
                  method="post"
                  hx-boost="false"
                  th:if="${canEditScript}">
                <input type="hidden" name="id" th:value="${commandModel.id}" />
                <input type="hidden" name="projectId" th:value="${projectId}" />
                <input type="hidden" name="type" th:value="${isSong} ? 'SONG' : 'NOTES'" />
                <button type="submit"
                        class="project-list-action-btn project-list-action-btn--primary"
                        th:title="${isSong} ? 'Put this song back in the list' : 'Put this note back in the list'">Unarchive</button>
            </form>
        </div>

        <!--/* The song editor puts its menus on their own row under the breadcrumb,
               like the screenplay's toolbar row. The info popover lives in the
               breadcrumb bar above for both songs and notes. */-->
        <div class="text-document-toolbar-row" th:if="${isSong}">
            <div class="text-document-top-bar-actions">
                <!--/* .project-tools-group is the screenplay toolbar's menu-bar styling
                       (spacing, plain-label toggles, left-aligned panels, hidden toggle
                       icons). Wrapping the song menus in it keeps the two toolbars
                       identical rather than re-stating the rules for song selectors. */-->
                <div class="project-tools-group" role="group" aria-label="Song tools" th:if="${!isNew}">
                    <th:block th:replace="~{fragments/songFileMenu :: menu(${commandModel.id}, ${projectId})}"></th:block>
                    <th:block th:replace="~{fragments/songEditMenu :: menu(${commandModel.id}, ${editionId})}"></th:block>
                    <th:block th:replace="~{fragments/songVersionMenu :: menu}"></th:block>
                    <th:block th:replace="~{fragments/songToolsMenu :: menu}"></th:block>
                </div>
            </div>
            <div class="text-document-meta-bar text-document-meta-bar--toolbar">
                <span class="song-word-count muted"
                      id="song-word-count"
                      th:if="${!isNew}"
                      role="status"
                      aria-live="polite"
                      title="Word count for this song">
                    <span data-stat="words">0</span> words
                </span>
                <th:block th:replace="~{fragments/textDocumentMeta :: meta(${updatedAt})}"></th:block>
            </div>
        </div>

        <!--/* Notes get a formatting row in the same slot. The prefixes it inserts
               are plain text — nothing here is parsed or rendered as markup. */-->
        <div class="text-document-toolbar-row" th:unless="${isSong}">
            <div class="text-document-top-bar-actions">
                <div class="note-format-toolbar" role="group" aria-label="Formatting">
                    <button type="button" class="note-format-btn note-format-btn--icon" id="note-undo"
                            title="Undo" aria-label="Undo">&#8630;</button>
                    <button type="button" class="note-format-btn note-format-btn--icon" id="note-redo"
                            title="Redo" aria-label="Redo">&#8631;</button>
                    <span class="note-format-divider" aria-hidden="true"></span>
                    <button type="button" class="note-format-btn" data-note-format="bullet"
                            title="Bullet list" aria-label="Bullet list">&bull;&nbsp;List</button>
                    <button type="button" class="note-format-btn" data-note-format="ordered"
                            title="Numbered list" aria-label="Numbered list">1.&nbsp;List</button>
                    <span class="note-format-divider" aria-hidden="true"></span>
                    <button type="button" class="note-format-btn" data-note-format="h1"
                            title="Heading 1" aria-label="Heading 1">H1</button>
                    <button type="button" class="note-format-btn" data-note-format="h2"
                            title="Heading 2" aria-label="Heading 2">H2</button>
                    <button type="button" class="note-format-btn" data-note-format="h3"
                            title="Heading 3" aria-label="Heading 3">H3</button>
                    <span class="note-format-divider" aria-hidden="true"></span>
                    <!--/* The editing lock (document-lock.js). A note is the shot
                           list held up on set and the production notes open on a
                           stand — read from in the places a stray thumb costs
                           something. Device-local, like the screenplay's. */-->
                    <button type="button"
                            class="note-format-btn document-lock-toggle"
                            th:if="${canEditScript}"
                            data-document-lock
                            aria-pressed="false"
                            aria-label="Lock editing"
                            title="Close this to typing on this device">
                        <span th:replace="~{fragments/lockIcon :: toolbarIcon}"></span>
                        <span data-document-lock-label>Lock</span>
                    </button>
                    <span class="note-format-divider" aria-hidden="true"></span>
                    <!--/* Read aloud (read-aloud.js). A note is prose with the
                           prefixes this toolbar writes, and the reading takes
                           them off rather than saying "hash Act One". The button
                           hides itself where the browser has no voices. */-->
                    <button type="button" class="note-format-btn" data-read-aloud-entry
                            title="Read this note aloud" aria-label="Read aloud">Read aloud</button>
                </div>
            </div>
        </div>

        <p class="text-document-import-banner"
           th:if="${documentImportMessage != null}"
           th:text="${documentImportMessage}"
           role="status"></p>

        <form th:action="@{/project/documents/save}"
              method="post"
              th:object="${commandModel}"
              class="text-document-form"
              id="text-document-form"
              hx-boost="false"
              onsubmit="return false;">
            <input type="hidden" th:field="*{id}" />
            <input type="hidden" th:field="*{projectId}" />
            <input type="hidden" th:field="*{documentType}" />

            <div class="text-document-editor-shell">
                <label th:unless="${isSong}" class="text-document-content-label">
                    <span class="visually-hidden">Content</span>
                    <textarea th:field="*{content}"
                              id="text-document-content"
                              class="text-document-content"
                              rows="18"
                              aria-label="Content"
                              th:placeholder="'Write notes or scratch text here…&#10;&#10;Each line will become a Note block when inserted.'"
                              autocomplete="off"
                              spellcheck="true"></textarea>
                </label>
                <div th:if="${isSong}"
                     class="song-blocks-editor"
                     th:attr="data-document-id=${commandModel.id},data-edition-id=${editionId}"
                     data-can-edit="true">
                    <div th:replace="~{songblock/blocks :: blocks}"></div>
                </div>
            </div>

            <!--/* What this song sounds like, under the words it is made of.
                   Only for a song that exists: a new one has no id yet to hang
                   a recording on, and the panel appears as soon as it does. */-->
            <th:block th:if="${isSong and !isNew}"
                      th:replace="~{fragments/songAudio :: panel(${commandModel.id}, ${canEditScript})}"></th:block>

            <!--/* Songs render these on the toolbar row above instead. */-->
            <div class="text-document-meta-bar" th:unless="${isSong}">
                <th:block th:replace="~{fragments/textDocumentMeta :: meta(${updatedAt})}"></th:block>
            </div>
        </form>
    </main>
    <script src="/js/htmx.min.js"></script>
    <script src="/js/htmx-security.js"></script>
    <script th:src="@{/js/_hyperscript.min.js}"></script>
    <script th:src="@{/js/text-document-edit.js(v=${assetVersion})}"></script>
    <script th:if="${isSong}" th:src="@{/js/song-audio.js(v=${assetVersion})}"></script>
</body>
</html>
